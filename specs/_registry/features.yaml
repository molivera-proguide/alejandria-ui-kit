  - id: fix-005-modulecard-stacking
    type: fix
    status: CLOSED
    domain: component-catalog
    owner: lvgonzalezprg
    sprint: null
    created: 2026-08-13
    closed: 2026-08-13
    touches:
      - packages/ui/src/styles.css
    decisions:
      - "2026-08-13: ModuleCard sin position propio → BackgroundTextureDots (absolute) se pintaba por encima en Dashboard, no por debajo"
    note: >
      Luna reportó en Dashboard (fix-004, verificación del rollout del
      gradiente) que la textura animada se ve por encima de las ModuleCard, no
      detrás. Causa raíz: `.ds-module-card` no fijaba `position` (quedaba
      `static`), y un `position: absolute` con z-index auto se pinta siempre
      por encima de contenido `static` sin importar el orden real en el DOM —
      mismo bug de fondo ya documentado y resuelto para `.ds-task` (ver su
      comentario en styles.css), nunca aplicado a ModuleCard porque hasta ahora
      ningún screen combinaba ModuleCard con BackgroundTextureDots. Fix: agregar
      `position: relative` a `.ds-module-card` (sin `isolation: isolate` — no
      tiene hijos/pseudo-elementos con z-index propio que necesiten
      contenerse, a diferencia de .ds-task). Sin colisión de equipo — no hay
      features OPEN al momento de este fix.

  - id: fix-006-sidebar-viewport-height
    type: fix
    status: CLOSED
    domain: component-catalog
    owner: lvgonzalezprg
    sprint: null
    created: 2026-08-13
    closed: 2026-08-13
    touches:
      - packages/ui/src/styles.css
    decisions:
      - "2026-08-13: SideBar se estiraba a la altura de su hermano de contenido (align-items:stretch) en vez de quedar capada al viewport"
    note: >
      Luna reportó que la SideBar se extiende al tamaño del contenido (grillas
      largas de TaskCard), obligando a scrollear la página entera para ver los
      ítems del final (Notificaciones/Mi cuenta/Configuración). Causa raíz:
      `.ds-sidebar` usaba `height: auto` + `min-height: 100%`, dependiendo de
      `align-items: stretch` (default del row en screens/*) para llenar la
      altura del row — exactamente lo que hacía que se estirara junto con su
      hermano de contenido en vez de quedar fija al viewport. Ese mecanismo
      venía de 006-sidebar-ancho-toggle (ver Changelog 0.2.0 en
      knowledge/components/SideBar.md) — no se revierte esa feature, se
      reemplaza su mecanismo por uno que sí cumple el objetivo real ("sidebar
      siempre entera en el viewport, el scroll lo maneja el contenido"). Fix:
      `align-self: flex-start` (sale del stretch del row) + `height: 100vh` +
      `position: sticky; top: 0` (mismo rol de "positioned" que ya cumplía
      `position: relative` para el fix de stacking con BackgroundTextureDots de
      esa misma feature — no se pierde). Tocado con cuidado: esta zona exacta
      de `.ds-sidebar` ya acumula 3 regresiones documentadas en
      006-sidebar-ancho-toggle (padding de labels, height/min-height, stacking
      del fondo animado) — el cambio se acota a las 3 propiedades
      (align-self/height/position) sin tocar padding/overflow/width, que no
      están relacionados con este bug. Sin colisión de equipo — no hay
      features OPEN al momento de este fix.

